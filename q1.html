<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 - Check Even or Odd</title>
  <style>
    body { max-width: 680px; margin: 60px auto; padding: 0 20px; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
    input, button { padding: 10px 12px; border-radius: 7px; font: inherit; }
    input { width: 180px; border: 1px solid #b9c2d0; }
    button { border: 0; background: #2356c4; color: white; cursor: pointer; }
    output { display: block; margin-top: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Q1. Check Even or Odd</h1>
  <p>Enter a number, then click the button.</p>
  <form id="checkForm" novalidate>
    <input id="numberInput" type="text" inputmode="decimal" aria-label="Enter a number" placeholder="Enter a number">
    <button id="checkButton" type="submit">Check Number</button>
  </form>
  <output id="result" aria-live="polite"></output>
  <script>
    document.getElementById("checkForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const input = document.getElementById("numberInput").value.trim();
      const result = document.getElementById("result");
      if (input === "" || !Number.isFinite(Number(input))) {
        result.textContent = "Please enter a valid number.";
        return;
      }

      const number = Number(input);
      const message = number % 2 === 0 ? "The number is Even" : "The number is Odd";
      result.textContent = message;
      console.log(message);
    });
  </script>
</body>
</html>
