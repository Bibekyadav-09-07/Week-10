<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q10 - Simple Grade Calculator</title>
  <style>
    body { max-width: 680px; margin: 60px auto; padding: 0 20px; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
    label { display: block; margin-bottom: 7px; font-weight: 600; }
    input { width: 100%; max-width: 300px; padding: 10px; border: 1px solid #b9c2d0; border-radius: 7px; font: inherit; }
    button { display: block; margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 7px; background: #2356c4; color: white; cursor: pointer; }
    #result { margin-top: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Q10. Simple Grade Calculator</h1>
  <form id="gradeForm" novalidate>
    <label for="marks">Marks (0-100)</label>
    <input id="marks" type="number" step="any" inputmode="decimal" required>
    <button type="submit">Calculate Grade</button>
  </form>
  <p id="result" aria-live="polite"></p>
  <script>
    document.getElementById("gradeForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const input = document.getElementById("marks").value.trim();
      const result = document.getElementById("result");
      if (input === "" || !Number.isFinite(Number(input)) || Number(input) < 0 || Number(input) > 100) {
        result.textContent = "Invalid Marks";
        return;
      }

      const marks = Number(input);
      let grade;
      if (marks >= 90) {
        grade = "A+";
      } else if (marks >= 80) {
        grade = "A";
      } else if (marks >= 70) {
        grade = "B";
      } else if (marks >= 60) {
        grade = "C";
      } else if (marks >= 50) {
        grade = "D";
      } else {
        grade = "F";
      }
      result.textContent = "Grade: " + grade;
    });
  </script>
</body>
</html>
